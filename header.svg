<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 80" width="800" height="80" role="img" aria-label="Bannière : grille de carrés façon GitHub traversée par quatre carrés portant Java, Python, PHP et SQL">
  <style>
    .carre { animation: traverse 8s linear infinite; }
    .java { animation-delay: 0s; }
    .py   { animation-delay: -2s; }
    .php  { animation-delay: -4s; }
    .sql  { animation-delay: -6s; }

    @keyframes traverse {
      from { transform: translateX(-60px); }
      to   { transform: translateX(840px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .carre { animation: none; }
    }

    text { font: 700 14px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #0d1117; }
  </style>

  <defs>
    <pattern id="g" x="10" y="5" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" rx="2" fill="#161b22"/>
    </pattern>
  </defs>

  <rect x="0.5" y="0.5" width="799" height="79" rx="10" fill="#0d1117" stroke="#30363d"/>
  <rect x="10" y="5" width="780" height="70" fill="url(#g)"/>

  <g stroke-width="4" stroke-linejoin="round">
