    <path fill="#39d353" stroke="#39d353" d="M22 57h4v4h-4zM102 67h4v4h-4zM132 57h4v4h-4zM182 7h4v4h-4zM342 7h4v4h-4zM432 47h4v4h-4zM502 47h4v4h-4zM602 57h4v4h-4zM642 67h4v4h-4zM652 37h4v4h-4zM672 67h4v4h-4z"/>
  </g>

  <g class="carre java" transform="translate(150 0)">
    <rect y="15" width="48" height="48" rx="8" fill="#f89820"/>
    <text x="24" y="39" dy=".35em" text-anchor="middle">Java</text>
  </g>
  <g class="carre py" transform="translate(330 0)">
    <rect y="15" width="48" height="48" rx="8" fill="#ffd43b"/>
    <text x="24" y="39" dy=".35em" text-anchor="middle">Py</text>
  </g>
  <g class="carre php" transform="translate(510 0)">
    <rect y="15" width="48" height="48" rx="8" fill="#8892bf"/>
    <text x="24" y="39" dy=".35em" text-anchor="middle">PHP</text>
  </g>
  <g class="carre sql" transform="translate(690 0)">
    <rect y="15" width="48" height="48" rx="8" fill="#4fa3e0"/>
    <text x="24" y="39" dy=".35em" text-anchor="middle">SQL</text>
  </g>
</svg>
